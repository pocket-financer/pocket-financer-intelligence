name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Guard tracked repository contents
        run: python scripts/check_repo_safety.py

      - name: Verify native SMS contract manifest
        run: python scripts/sync_native_assets.py --check --manifest-only

      - name: Verify Unix LF line endings and git whitespace hygiene
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          text_suffixes = {
              ".sh", ".py", ".json", ".jsonl", ".txt", ".gbnf",
              ".md", ".yml", ".yaml", ".toml", ".html", ".css", ".js",
          }
          tracked = [
              item.decode("utf-8")
              for item in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if item
          ]
          crlf_files = [
              path
              for path in tracked
              if pathlib.Path(path).suffix.lower() in text_suffixes
              and b"\r\n" in pathlib.Path(path).read_bytes()
          ]
          if crlf_files:
              print("CRLF line endings found in tracked files:", file=sys.stderr)
              for path in crlf_files:
                  print(f"  - {path}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified LF line endings across {len(tracked)} tracked files.")
          PY
          git diff --check

      - name: Install lightweight CI tools
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run Python static checks
        run: |
          python -m ruff check .
          python -m ruff check --select E4,E7,E9,F src scripts tests

      - name: Check tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shell_list="$(mktemp)"
          trap 'rm -f "$shell_list"' EXIT
          git ls-files -z -- '*.sh' > "$shell_list"
          mapfile -d '' -t shell_files < "$shell_list"
          if ((${#shell_files[@]})); then
            shellcheck \
              --external-sources \
              --exclude=SC1090,SC1091,SC2086,SC2162,SC2317 \
              -- "${shell_files[@]}"
          fi

      - name: Run unit tests
        run: python -m pytest -v
