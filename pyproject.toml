[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".hf_cache",
    ".venv",
    "lm-evaluation-harness",
    "MODELS",
    "PRIVATE_DATA",
    "PUBLIC_CANDIDATE",
    "RESULTS",
    "TRAINING_ARTIFACTS",
    "UPSTREAM",
]

[tool.ruff.lint]
# Enforce syntax and fatal static errors across the full repository (including legacy root tools).
# CI additionally enforces E4, E7, E9, F across src/, scripts/, and tests/.
select = ["E9", "F63", "F7", "F82"]
